[package]
name = "vox-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Multi-Provider AI Multimedia CLI"
license = "MIT"
repository = "https://github.com/huangcheng/vox"
homepage = "https://github.com/huangcheng/vox"
documentation = "https://github.com/huangcheng/vox#readme"
keywords = ["ai", "cli", "tts", "image-generation", "llm"]
categories = ["command-line-utilities", "multimedia"]

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm", "dep:ratatui-image", "dep:image"]

[lib]
name = "vox"
path = "src/lib.rs"

[[bin]]
name = "vox"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# TUI (optional)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }
ratatui-image = { version = "10", default-features = false, features = ["image-defaults", "crossterm"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"
dirs = "5"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Cross-platform open
open = "5"

# Async trait
async-trait = "0.1"

# Base64 encoding
base64 = "0.22"

# Progress indicators
indicatif = "0.17"

# REPL
rustyline = "15"

[dev-dependencies]
mockito = "1"
insta = "1"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
