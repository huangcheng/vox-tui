[package]
name = "vox-tui"
version = "0.1.0"
edition = "2024"
description = "Multi-Provider AI Multimedia TUI"
license = "MIT"

[lib]
name = "vox_tui"
path = "src/lib.rs"

[[bin]]
name = "vox"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"
dirs = "5"

# SSE
futures-util = "0.3"

[dev-dependencies]
mockito = "1"
insta = "1"
