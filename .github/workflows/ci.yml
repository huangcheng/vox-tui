name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo check (default — CLI only)
        run: cargo check

      - name: cargo check (with TUI feature)
        run: cargo check --features tui

      - name: cargo test
        run: cargo test

      - name: cargo test (with TUI feature)
        run: cargo test --features tui

      - name: cargo clippy (default)
        run: cargo clippy -- -D warnings

      - name: cargo clippy (with TUI feature)
        run: cargo clippy --features tui -- -D warnings

      - name: cargo doc
        run: cargo doc --no-deps
